<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document protejat</title>
<style>
  :root{--sunset:#FA357B;--midnight:#6561FF;--dark:#0e1020;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
    background:radial-gradient(900px 420px at 12% -10%, rgba(101,97,255,.35), transparent 60%),
               radial-gradient(700px 380px at 95% 10%, rgba(250,53,123,.28), transparent 60%),var(--dark);
    color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{width:100%;max-width:400px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:32px 28px;backdrop-filter:blur(8px)}
  h1{margin:0 0 6px;font-size:1.25rem;letter-spacing:-.01em}
  p{margin:0 0 22px;font-size:.88rem;color:rgba(255,255,255,.62);line-height:1.5}
  label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.55);margin-bottom:8px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.28);color:#fff;font-size:1rem;outline:none}
  input:focus{border-color:var(--midnight)}
  button{width:100%;margin-top:14px;padding:12px 14px;border:0;border-radius:10px;cursor:pointer;
    background:var(--sunset);color:#fff;font-size:.95rem;font-weight:600}
  button:disabled{opacity:.6;cursor:default}
  .err{margin-top:12px;font-size:.84rem;color:#ff9db9;min-height:1.2em}
</style>
</head>
<body>
<div class="card">
  <h1>Document protejat</h1>
  <p>Introdu parola pentru a vizualiza continutul.</p>
  <form id="f">
    <label for="p">Parola</label>
    <input id="p" type="password" autocomplete="off" autofocus>
    <button id="b" type="submit">Deschide</button>
  </form>
  <div class="err" id="e"></div>
</div>

<script>
(function(){
  var D = JSON.parse(document.getElementById('d').textContent);
  var f = document.getElementById('f'), e = document.getElementById('e'), b = document.getElementById('b');
  function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  f.addEventListener('submit', async function(ev){
    ev.preventDefault();
    e.textContent=''; b.disabled=true; b.textContent='Se decripteaza...';
    try{
      var pw = document.getElementById('p').value;
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(D.salt), iterations:D.iter, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.iv)}, key, b64(D.ct));
      var html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    }catch(err){
      b.disabled=false; b.textContent='Deschide';
      e.textContent='Parola incorecta.';
      document.getElementById('p').select();
    }
  });
})();
</script>
